{% extends 'base.html' %}
{% block title %}404 — Page Not Found{% endblock %}

<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;text-align:center;padding:40px">
  <div style="font-size:80px;margin-bottom:24px">🔍</div>
  <h1 style="font-size:48px;font-weight:800;margin-bottom:12px">404</h1>
  <p style="color:var(--muted);font-size:18px;margin-bottom:32px">The page you're looking for doesn't exist.</p>
  <a href="{{ url_for('main.index') }}" class="btn-primary" style="padding:12px 28px;border-radius:10px;text-decoration:none">← Back to Home</a>

{% endblock %}
