version: '3.8'

services:
  mysql:
    image: mysql:8.0.45  # ← YOUR exact version!
    container_name: mysql-ticket-benchmark
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password # Strong password
      MYSQL_DATABASE: ticket_benchmark
      MYSQL_USER: root
      MYSQL_PASSWORD: password
    ports:
      - "3307:3306"  # Host:3306 → Container:3306
    volumes:
      - mysql_data:/var/lib/mysql  # Persistent data
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword123"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  mongodb:
    image: mongo:8.2.4
    container_name: mongodb-ticket-benchmark
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  flask-app:
    build: .
    container_name: flask-ticket-app
    restart: on-failure
    ports:
      - "5001:5000"
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      PYTHONDONTWRITEBYTECODE: 1
      PYTHONUNBUFFERED: 1
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: password
      MYSQL_DB: ticket_benchmark
      MYSQL_URI: mysql+pymysql://root:password@mysql:3306/ticket_benchmark
      MONGO_URI: mongodb://admin:password@mongodb:27017/
      FLASK_ENV: development
    volumes:
      - .:/app

volumes:
  mysql_data:
  mongo_data: